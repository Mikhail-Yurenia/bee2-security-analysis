      .severity-low {
  background-color: #669603;
}

.severity-low:after {
  content : 'L';
}

.severity-unspecified {
  background-color: #666666;
}

.severity-unspecified:after {
  content : 'U';
}

.severity-style {
  background-color: #9932cc;
}

.severity-style:after {
  content : 'S';
}

.severity-medium {
  background-color: #a9d323;
  color: black;
}

.severity-medium:after {
  content : 'M';
}

.severity-high {
  background-color: #ffa800;
}

.severity-high:after {
  content : 'H';
}

.severity-critical {
  background-color: #e92625;
}

.severity-critical:after {
  content : 'C';
}

i[class*="severity-"] {
  line-height: normal;
  text-transform: capitalize;
  font-size: 0.8em;
  font-weight: bold;
  color: white;
  display: inline-block;
  width: 16px;
  height: 16px;
  text-align: center;
  font-family: sans-serif;
}

      html, body {
  width: 100%;
  height: 100%;
  padding: 0px;
  margin: 0px;
}

div.container {
  padding: 10px;
}

#content {
  height: 100%;
  display: block;
  overflow: hidden;
}

#content > div {
  margin: 10px;
  border: 1px solid #ddd;
  border-radius: 3px;
  height: 97%;
}

#side-bar {
  overflow: auto;
}

#editor-wrapper {
  overflow: hidden;
}

.button {
  background-color: #f1f1f1;
  text-decoration: none;
  display: inline-block;
  padding: 8px 16px;
  color: black;
  cursor: pointer;
}

.button:hover {
  background-color: #ddd;
  color: black;
}

.review-status {
  color: white;
  text-align: center;
}

.review-status-confirmed {
  background-color: #e92625;
}

.review-status-false-positive {
  background-color: grey;
}

.review-status-intentional {
  background-color: #669603;
}

      div.container {
  width: 100%;
  height: 100%;
  padding: 0px;
}

#editor-wrapper {
  margin: 10px;
}

#side-bar {
  float: left;
  width: 260px;
  margin: 0px;
}

#report-nav ul {
  list-style-type: none;
  padding: 0;
  margin: 0;
  overflow-y: auto;
  height: 100%;
}

#report-nav ul > li {
  padding: .4em;
  background-color: #fff;
  border-bottom: 1px solid rgba(0,0,0,.125);
  text-align: left;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

#report-nav ul > li.active {
  background-color: #427ea9;
  color: white;
}

#report-nav ul > li:hover {
  background-color: #427ea9;
  color: white;
  cursor: pointer;
}

#report-nav ul a {
  text-decoration: none;
}

#report-nav i[class*="severity-"] {
  margin-right: 5px;
}

.header {
  border-bottom: 1px solid lightgrey;
  font-family: monospace;
  padding: 10px;
  background-color: #fafbfc;
  border-bottom: 1px solid #e1e4e8;
  border-top-left-radius: 2px;
  border-top-right-radius: 2px;
}

#report-nav .header {
  font-weight: bold;
}

#editor-wrapper .header > div {
  padding-top: 2px;
}

#file-path,
#checker-name {
  color: #195ea2;
}

#review-status {
  padding: 0px 5px;
}

#file-path {
  font-family: monospace;
}

.check-msg {
  display: inline-block;
  padding: 3px 6px;
  margin: 1px;
  -webkit-border-radius: 5px;
  -moz-border-radius: 5px;
  border-radius: 5px;
}

.check-msg.info {
  color: #00546f;
  background-color: #bfdfe9;
  border: 1px solid #87a8b3;
}

.check-msg.error {
  background-color: #f2dede;
  color: #a94442;
  border: 1px solid #ebcccc;
}

.check-msg.macro {
  background-color: #d7dac2;
  color: #4f5c6d;
  border: 1px solid #d7dac2;
}

.check-msg.note {
  background-color: #d7d7d7;
  color: #4f5c6d;
  border: 1px solid #bfbfbf;
}

.check-msg.current {
  border: 2px dashed #3692ff;
}

.check-msg .tag {
  padding: 1px 5px;
  text-align: center;
  border-radius: 2px;
  margin-right: 5px;
  text-decoration: inherit;
}

.check-msg .tag.macro {
  background-color: #83876a;
  color: white;
  text-transform: capitalize;
}

.check-msg .tag.note {
  background-color: #9299a1;
  color: white;
  text-transform: capitalize;
}

.checker-enum {
  color: white;
  padding: 1px 5px;
  text-align: center;
  border-radius: 25px;
  margin-right: 5px;
  text-decoration: inherit;
}

.checker-enum.info {
  background-color: #427ea9;
}

.checker-enum.error {
  background-color: #a94442;
}

.arrow {
  border: solid black;
  border-width: 0 3px 3px 0;
  display: inline-block;
  padding: 3px;
  cursor: pointer;
  margin: 0px 5px;
}

.arrow:hover {
  border: solid #437ea8;
  border-width: 0 3px 3px 0;
}

.left-arrow {
  transform: rotate(135deg);
  -webkit-transform: rotate(135deg);
}

.right-arrow {
  transform: rotate(-45deg);
  -webkit-transform: rotate(-45deg);
}

var BugViewer = {
  _files : [],
  _reports : [],
  _lineWidgets : [],
  _navigationMenuItems : [],
  _sourceFileData : null,
  _currentReport : null,
  _lastBugEvent  : null,

  init : function (files, reports) {
    this._files = files;
    this._reports = reports;

    this.initEscapeChars();
  },

  initEscapeChars : function () {
    this.escapeChars = {
      ' ' : 'nbsp',
      '<' : 'lt',
      '>' : 'gt',
      '"' : 'quot',
      '&' : 'amp'
    };

    var regexString = '[';
    for (var key in this.escapeChars) {
      regexString += key;
    }
    regexString += ']';

    this.escapeRegExp = new RegExp( regexString, 'g');
  },

  escapeHTML : function (str) {
    var that = this;

    return str.replace(this.escapeRegExp, function (m) {
      return '&' + that.escapeChars[m] + ';';
    });
  },

  initByUrl : function () {
    if (!this._reports) return;

    var state = {};
    window.location.hash.substr(1).split('&').forEach(function (s) {
      var parts = s.split('=');
      state[parts[0]] = parts[1];
    });

    for (var key in this._reports) {
      var report = this._reports[key];
      if (report.reportHash === state['reportHash']) {
        this.navigate(report);
        return;
      }
    }

    this.navigate(this._reports[0]);
  },

  create : function () {
    this._content = document.getElementById('editor-wrapper');
    this._filepath = document.getElementById('file-path');
    this._checkerName = document.getElementById('checker-name');
    this._reviewStatusWrapper =
      document.getElementById('review-status-wrapper');
    this._reviewStatus = document.getElementById('review-status');
    this._editor = document.getElementById('editor');

    this._codeMirror = CodeMirror(this._editor, {
      mode: 'text/x-c++src',
      matchBrackets : true,
      lineNumbers : true,
      readOnly : true,
      foldGutter : true,
      extraKeys : {},

    });

  },

  navigate : function (report, item) {

      });

  _createNavigationMenu : function () {

      var lastBugEvent = events[events.length - 1];
      var item = document.createElement('li');

      var severity = document.createElement('i');
      severity.className = 'severity-' + report.severity.toLowerCase();

      item.appendChild(severity);
      item.appendChild(document.createTextNode(report.message));

      that._navigationMenuItems.push({ report : report, widget : item });

  setReport : function (report) {

  setCurrentBugEvent : function (event, idx) {

  highlightBugEvent : function (idx) {

  setChecker : function (checker) {

  setReviewStatus : function (status) {

  setSourceFileData : function (file) {

  _refresh : function () {

  clearBubbles : function () {

  getMessage : function (event, kind) {

  addExtraPathEvents : function (events, kind) {

  renderMainWarning : function (currentEvents) {

      return true;
    }

    return false;
  },

  drawBugPath : function () {

      element.setAttribute('idx', step);

      enumeration.setAttribute('class', 'checker-enum ' + type);

      if (nextBugEvent < currentEvents.length) {
        var nextBug = document.createElement('span');
        nextBug.setAttribute('class', 'arrow right-arrow');

        });

    // error node.

    if (this.renderMainWarning(currentEvents)) {

      element.setAttribute('style', 'margin-left: ' + left);
      element.setAttribute('class', 'check-msg ' + "error");
      var error_tag = document.createElement('span');
      error_tag.setAttribute('class', 'checker-enum error');
      error_tag.innerHTML = "E";
      element.appendChild(error_tag);
      var msg = document.createElement('span');
      msg.innerHTML = that.escapeHTML(this._currentReport.message)
        .replace(/(?:\r\n|\r|\n)/g, '<br>');
      element.appendChild(msg);
      that._lineWidgets.push(that._codeMirror.addLineWidget(
        this._currentReport.line - 1, element));
    }
  },

  jumpTo : function (line, column) {
    var that = this;

    setTimeout(function () {
      var selPosPixel
        = that._codeMirror.charCoords({ line : line, ch : column }, 'local');

        width  : that._editor.clientWidth,
        height : that._editor.clientHeight

        top    : selPosPixel.top - 100,
        bottom : selPosPixel.top + editorSize.height - 150,
        left   : selPosPixel.left < editorSize.width - 100

               : selPosPixel.left - 50,
        right  : selPosPixel.left < editorSize.width - 100
               ? 10
               : selPosPixel.left + editorSize.width - 100
      });
    }, 0);
  }
}

\u0434\u0432\u0430\u0440\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0435 \u0445\u044d\u0448\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0435 \u0432\u044b\u043f\u043e\u043b\u043d\u044f\u0435\u0442\u0441\u044f \u0441 \n  \u043f\u043e\u043c\u043e\u0449\u044c\u044e \u0430\u043b\u0433\u043e\u0440\u0438\u0442\u043c\u0430 bash384.\n\n\u041f\u043e\u0432\u0442\u043e\u0440\u044f\u044e\u0442\u0441\u044f \u0441\u043e\u0433\u043b\u0430\u0448\u0435\u043d\u0438\u044f \u0438 \u0438\u043d\u0442\u0435\u0440\u0444\u0435\u0439\u0441\u044b \u043c\u043e\u0434\u0443\u043b\u044f bee2/crypto/bign. \u0418\u043d\u0442\u0435\u0440\u0444\u0435\u0439\u0441\u044b \n\u0443\u043f\u0440\u043e\u0449\u0430\u044e\u0442\u0441\u044f: \u0438\u0437 \u0432\u0445\u043e\u0434\u043d\u044b\u0445 \u0438 \u0432\u044b\u0445\u043e\u0434\u043d\u044b\u0445 \u0434\u0430\u043d\u043d\u044b\u0445 \u0438\u0441\u043a\u043b\u044e\u0447\u0430\u044e\u0442\u0441\u044f \u0434\u043e\u043b\u0433\u043e\u0432\u0440\u0435\u043c\u0435\u043d\u043d\u044b\u0435 \u043f\u0430\u0440\u0430\u043c\u0435\u0442\u0440\u044b \n\u0438 \u0438\u0434\u0435\u043d\u0442\u0438\u0444\u0438\u043a\u0430\u0442\u043e\u0440 \u0430\u043b\u0433\u043e\u0440\u0438\u0442\u043c\u0430 \u043f\u0440\u0435\u0434\u0432\u0430\u0440\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0433\u043e \u0445\u044d\u0448\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u044f.\n\n\\expect{ERR_BAD_INPUT} \u0412\u0441\u0435 \u0432\u0445\u043e\u0434\u043d\u044b\u0435 \u0443\u043a\u0430\u0437\u0430\u0442\u0435\u043b\u0438 \u043a\u043e\u0440\u0440\u0435\u043a\u0442\u043d\u044b.\n\n\\warning \u0418\u0434\u0435\u043d\u0442\u0438\u0444\u0438\u043a\u0430\u0446\u0438\u043e\u043d\u043d\u0430\u044f \u042d\u0426\u041f \u043d\u0435 \u043f\u043e\u0434\u0434\u0435\u0440\u0436\u0438\u0432\u0430\u0435\u0442\u0441\u044f.\n*******************************************************************************\n*/\n\n/*\n*******************************************************************************\n\u0423\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u0435 \u043a\u043b\u044e\u0447\u0430\u043c\u0438\n*******************************************************************************\n*/\n\n/*!\t\\brief \u0413\u0435\u043d\u0435\u0440\u0430\u0446\u0438\u044f \u043f\u0430\u0440\u044b \u043a\u043b\u044e\u0447\u0435\u0439\n\n\t\u0413\u0435\u043d\u0435\u0440\u0438\u0440\u0443\u044e\u0442\u0441\u044f \u043b\u0438\u0447\u043d\u044b\u0439 privkey \u0438 \u043e\u0442\u043a\u0440\u044b\u0442\u044b\u0439 pubkey \u043a\u043b\u044e\u0447\u0438. \u041f\u0440\u0438 \u0433\u0435\u043d\u0435\u0440\u0430\u0446\u0438\u0438 \n\t\u0438\u0441\u043f\u043e\u043b\u044c\u0437\u0443\u0435\u0442\u0441\u044f \u0433\u0435\u043d\u0435\u0440\u0430\u0442\u043e\u0440 rng \u0438 \u0435\u0433\u043e \u0441\u043e\u0441\u0442\u043e\u044f\u043d\u0438\u0435 rng_state.\n\t\\expect{ERR_BAD_RNG} \u0413\u0435\u043d\u0435\u0440\u0430\u0442\u043e\u0440 rng (\u0441 \u0441\u043e\u0441\u0442\u043e\u044f\u043d\u0438\u0435\u043c rng_state) \u043a\u043e\u0440\u0440\u0435\u043a\u0442\u0435\u043d.\n\t\\expect \u0418\u0441\u043f\u043e\u043b\u044c\u0437\u0443\u0435\u0442\u0441\u044f \u043a\u0440\u0438\u043f\u0442\u043e\u0433\u0440\u0430\u0444\u0438\u0447\u0435\u0441\u043a\u0438 \u0441\u0442\u043e\u0439\u043a\u0438\u0439 \u0433\u0435\u043d\u0435\u0440\u0430\u0442\u043e\u0440 rng.\n\t\\return ERR_OK, \u0435\u0441\u043b\u0438 \u043a\u043b\u044e\u0447\u0438 \u0443\u0441\u043f\u0435\u0448\u043d\u043e \u0441\u0433\u0435\u043d\u0435\u0440\u0438\u0440\u043e\u0432\u0430\u043d\u044b, \u0438 \u043a\u043e\u0434 \u043e\u0448\u0438\u0431\u043a\u0438\n\t\u0432 \u043f\u0440\u043e\u0442\u0438\u0432\u043d\u043e\u043c \u0441\u043b\u0443\u0447\u0430\u0435.\n*/\nerr_t bign192KeypairGen(\n\toctet privkey[48],\t\t\t/*!&lt; [out] \u043b\u0438\u0447\u043d\u044b\u0439 \u043a\u043b\u044e\u0447 */\n\toctet pubkey[96],\t\t\t/*!&lt; [out] \u043e\u0442\u043a\u0440\u044b\u0442\u044b\u0439 \u043a\u043b\u044e\u0447 */\n\tgen_i rng,\t\t\t\t\t/*!&lt; [in] \u0433\u0435\u043d\u0435\u0440\u0430\u0442\u043e\u0440 \u0441\u043b\u0443\u0447\u0430\u0439\u043d\u044b\u0445 \u0447\u0438\u0441\u0435\u043b */\n\tvoid* rng_state\t\t\t\t/*!&lt; [in/out] \u0441\u043e\u0441\u0442\u043e\u044f\u043d\u0438\u0435 \u0433\u0435\u043d\u0435\u0440\u0430\u0442\u043e\u0440\u0430 */\n);\n\n/*!\t\\brief \u041f\u0440\u043e\u0432\u0435\u0440\u043a\u0430 \u043f\u0430\u0440\u044b \u043a\u043b\u044e\u0447\u0435\u0439\n\n\t\u041f\u0440\u043e\u0432\u0435\u0440\u044f\u0435\u0442\u0441\u044f \u043a\u043e\u0440\u0440\u0435\u043a\u0442\u043d\u043e\u0441\u0442\u044c \u043b\u0438\u0447\u043d\u043e\u0433\u043e \u043a\u043b\u044e\u0447\u0430 privkey \u0438 \u0441\u043e\u043e\u0442\u0432\u0435\u0442\u0441\u0442\u0432\u0438\u0435 \u0435\u043c\u0443 \u043e\u0442\u043a\u0440\u044b\u0442\u043e\u0433\u043e \n\t\u043a\u043b\u044e\u0447\u0430 pubkey. \n\t\\return ERR_OK, \u0435\u0441\u043b\u0438 \u043f\u0430\u0440\u0430 \u043a\u043e\u0440\u0440\u0435\u043a\u0442\u043d\u0430, \u0438 \u043a\u043e\u0434 \u043e\u0448\u0438\u0431\u043a\u0438 \u0432 \u043f\u0440\u043e\u0442\u0438\u0432\u043d\u043e\u043c \u0441\u043b\u0443\u0447\u0430\u0435.\n*/\nerr_t bign192KeypairVal(\n\tconst octet privkey[48],\t/*!&lt; [in] \u043b\u0438\u0447\u043d\u044b\u0439 \u043a\u043b\u044e\u0447 */\n\tconst octet pubkey[96]\t\t/*!&lt; [in] \u043e\u0442\u043a\u0440\u044b\u0442\u044b\u0439 \u043a\u043b\u044e\u0447 */\n);\n\n/*!\t\\brief \u041f\u0440\u043e\u0432\u0435\u0440\u043a\u0430 \u043e\u0442\u043a\u0440\u044b\u0442\u043e\u0433\u043e \u043a\u043b\u044e\u0447\u0430\n\n\t\u041f\u0440\u043e\u0432\u0435\u0440\u044f\u0435\u0442\u0441\u044f \u043a\u043e\u0440\u0440\u0435\u043a\u0442\u043d\u043e\u0441\u0442\u044c \u043e\u0442\u043a\u0440\u044b\u0442\u043e\u0433\u043e \u043a\u043b\u044e\u0447\u0430 pubkey.\n\t\\return ERR_OK, \u0435\u0441\u043b\u0438 \u043a\u043b\u044e\u0447 \u043a\u043e\u0440\u0440\u0435\u043a\u0442\u0435\u043d, \u0438 \u043a\u043e\u0434 \u043e\u0448\u0438\u0431\u043a\u0438 \u0432 \u043f\u0440\u043e\u0442\u0 3e\u0437\u0434\u0430\u043d\u0438\u0438 \u0442\u043e\u043a\u0435\u043d\u0430 \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u0443\u044e\u0442\u0441\u044f \u043e\u0442\u043a\u0440\u044b\u0442\u044b\u0439 \u043a\u043b\u044e\u0447 \u043f\u043e\u043b\u0443\u0447\u0430\u0442\u0435\u043b\u044f pubkey \u0438 \n\t\u0433\u0435\u043d\u0435\u0440\u0430\u0442\u043e\u0440 rng \u0441 \u0441\u043e\u0441\u0442\u043e\u044f\u043d\u0438\u0435\u043c rng_state.\n\t\\expect{ERR_BAD_INPUT} len &gt;= 16.\n\t\\expect{ERR_BAD_PUBKEY} \u041e\u0442\u043a\u0440\u044b\u0442\u044b\u0439 \u043a\u043b\u044e\u0447 pubkey \u043a\u043e\u0440\u0440\u0435\u043a\u0442\u0435\u043d.\n\t\\expect{ERR_BAD_RNG} \u0413\u0435\u043d\u0435\u0440\u0430\u0442\u043e\u0440 rng (\u0441 \u0441\u043e\u0441\u0442\u043e\u044f\u043d\u0438\u0435\u043c rng_state) \u043a\u043e\u0440\u0440\u0435\u043a\u0442\u0435\u043d.\n\t\\expect \u0418\u0441\u043f\u043e\u043b\u044c\u0437\u0443\u0435\u0442\u0441\u044f \u043a\u0440\u0438\u043f\u0442\u043e\u0433\u0440\u0430\u0444\u0438\u0447\u0435\u0441\u043a\u0438 \u0441\u0442\u043e\u0439\u043a\u0438\u0439 \u0433\u0435\u043d\u0435\u0440\u0430\u0442\u043e\u0440 rng.\n\t\\return ERR_OK, \u0435\u0441\u043b\u0438 \u0442\u043e\u043a\u0435\u043d \u0443\u0441\u043f\u0435\u0448\u043d\u043e \u0441\u043e\u0437\u0434\u0430\u043d, \u0438 \u043a\u043e\u0434 \u043e\u0448\u0438\u0431\u043a\u0438 \u0432 \u043f\u0440\u043e\u0442\u0438\u0432\u043d\u043e\u043c\n\t\u0441\u043b\u0443\u0447\u0430\u0435.\n\t\\remark \u041c\u043e\u0436\u0435\u0442 \u043f\u0435\u0440\u0435\u0434\u0430\u0432\u0430\u0442\u044c\u0441\u044f \u043d\u0443\u043b\u0435\u0432\u043e\u0439 \u0443\u043a\u0430\u0437\u0430\u0442\u0435\u043b\u044c header. \u0412 \u044d\u0442\u043e\u043c \u0441\u043b\u0443\u0447\u0430\u0435 \u0431\u0443\u0434\u0435\u0442\n\t\u0438\u0441\u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u0442\u044c\u0441\u044f \u0437\u0430\u0433\u043e\u043b\u043e\u0432\u043e\u043a \u0438\u0437 \u0432\u0441\u0435\u0445 \u043d\u0443\u043b\u0435\u0439.\n*/\nerr_t bign192KeyWrap(\n\toctet token[],\t\t\t\t/*!&lt; [out] \u0442\u043e\u043a\u0435\u043d \u043a\u043b\u044e\u0447\u0430 */\n\tconst octet key[],\t\t\t/*!&lt; [in] \u0442\u0440\u0430\u043d\u0441\u043f\u043e\u0440\u0442\u0438\u0440\u0443\u0435\u043c\u044b\u0439 \u043a\u043b\u044e\u0447 */\n\tsize_t len,\t\t\t\t\t/*!&lt; [in] \u0434\u043b\u0438\u043d\u0430 \u043a\u043b\u044e\u0447\u0430 \u0432 \u043e\u043a\u0442\u0435\u0442\u0430\u0445 */\n\tconst octet header[16],\t\t/*!&lt; [in] \u0437\u0430\u0433\u043e\u043b\u043e\u0432\u043e\u043a \u043a\u043b\u044e\u0447\u0430 */\n\tconst octet pubkey[96],\t\t/*!&lt; [in] \u043e\u0442\u043a\u0440\u044b\u0442\u044b\u0439 \u043a\u043b\u044e\u0447 \u043f\u043e\u043b\u0443\u0447\u0430\u0442\u0435\u043b\u044f */\n\tgen_i rng,\t\t\t\t\t/*!&lt; [in] \u0433\u0435\u043d\u0435\u0440\u0430\u0442\u043e\u0440 \u0441\u043b\u0443\u0447\u0430\u0439\u043d\u044b\u0445 \u0447\u0438\u0441\u0435\u043b */\n\tvoid* rng_state\t\t\t\t/*!&lt; [in,out] \u0441\u043e\u0441\u0442\u043e\u044f\u043d\u0438\u0435 \u0433\u0435\u043d\u0435\u0440\u0430\u0442\u043e\u0440\u0430 */\n);\n\n/*!\t\\brief \u0420\u0430\u0437\u0431\u043e\u0440 \u0442\u043e\u043a\u0435\u043d\u0430 \u043a\u043b\u044e\u0447\u0430\n\n\t\u041e\u043f\u0440\u0435\u0434\u0435\u043b\u044f\u0435\u0442\u0441\u044f \u043a\u043b\u044e\u0447 [len - 64]key, \u043a\u043e\u0442\u043e\u0440\u044b\u0439 \u0438\u043c\u0435\u0435\u0442 \u0437\u0430\u0433\u043e\u043b\u043e\u0432\u043e\u043a \n\t[16]header \u0438 \u0441\u043e\u0434\u0435\u0440\u0436\u0438\u0442\u0441\u044f \u0432 \u0442\u043e\u043a\u0435\u043d\u0435 [len]token. \u041f\u0440\u0438 \u0440\u0430\u0437\u0431\u043e\u0440\u0435 \u0442\u043e\u043a\u0435\u043d\u0430 \n\t\u0438\u0441\u043f\u043e\u043b\u044c\u0437\u0443\u0435\u0442\u0441\u044f \u043b\u0438\u0447\u043d\u044b\u0439 \u043a\u043b\u044e\u0447 privkey.\n\t\\expect{ERR_BAD_PRIVKEY} \u041b\u0438\u0447\u043d\u044b\u0439 \u043a\u043b\u044e\u0447 privkey \u043a\u043e\u0440\u0440\u0435\u043a\u0442\u0435\u043d.\n\t\\return ERR_OK, \u0435\u0441\u043b\u0438 \u0442\u043e\u043a\u0435\u043d \u0443\u0441\u043f\u0435\u0448\u043d\u043e \u0440\u0430\u0437\u043e\u0431\u0440\u0430\u043d, \u0438 \u043a\u043e\u0434 \u043e\u0448\u0438\u0431\u043a\u0438 \u0432 \u043f\u0440\u043e\u0442\u0438\u0432\u043d\u043e\u043c\n\t\u0441\u043b\u0443\u0447\u0430\u0435.\n\t\\remark \u041c\u043e\u0436\u0435\u0442 \u043f\u0435\u0440\u0435\u0434\u0430\u0432\u0430\u0442\u044c\u0441\u044f \u043d\u0443\u043b\u0435\u0432\u043e\u0439 \u0443\u043a\u0430\u0437\u0430\u0442\u0435\u043b\u044c header. \u0412 \u044d\u0442\u043e\u043c \u0441\u043b\u0443\u0447\u0430\u0435 \u0431\u0443\u0434\u0435\u0442\n\t\u0438\u0441\u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u0442\u044c\u0441\u044f \u0437\u0430\u0433\u043e\u043b\u043e\u0432\u043e\u043a \u0438\u0437 \u0432\u0441\u0435\u0445 \u043d\u0443\u043b\u0435\u0439.\n\t\\remark \u041f\u0440\u0438 \u043d\u0430\u0440\u0443\u0448\u0435\u043d\u0438\u0438 \u0446\u0435\u043b\u043e\u0441\u0442\u043d\u043e\u0441\u0442\u0438 \u0442\u043e\u043a\u0435\u043d\u0430 \u0432\u043e\u0437\u0432\u0440\u0430\u0449\u0430\u0435\u0442\u0441\u044f \u043a\u043e\u0434 ERR_BAD_KEYTOKEN.\n\t\u042d\u0442\u043e\u0442 \u043a\u043e\u0434 \u0431\u0443\u0434\u0435\u0442 \u0432\u043e\u0437\u0432\u0440\u0430\u0449\u0435\u043d, \u0435\u0441\u043b\u0438 len &lt; 80.\n*/\nerr_t bign192KeyUnwrap(\n\toctet key[],\t\t\t\t/*!&lt; [out] \u043a\u043b\u044e\u0447 */\n\tconst octet token[],\t\t/*!&lt; [in] \u0442\u043e\u043a\u0435\u043d \u043a\u043b\u044e\u0447\u0430 */\n\tsize_t len,\t\t\t\t\t/*!&lt; [in] \u0434\u043b\u0438\u043d\u0430 \u0442\u043e\u043a\u0435\u043d\u0430 \u0432 \u043e\u043a\u0442\u0435\u0442\u0430\u0445 */\n\tconst octet header[16],\t\t/*!&lt; [in] \u0437\u0430\u0433\u043e\u043b\u043e\u0432\u043e\u043a \u043a\u043b\u044e\u0447\u0430 */\n\tconst octet privkey[48]\t\t/*!&lt; [in] \u043b\u0438\u0447\u043d\u044b\u0439 \u043a\u043b\u044e\u0447 \u043f\u043e\u043b\u0443\u0447\u0430\u0442\u0435\u043b\u044f */\n);\n\n#ifdef __cplusplus\n} /* extern &quot;C&quot; */\n#endif\n\n#endif /* __BIGN192_H */\n"}, "/home/mikhail/bee2/src/crypto/bign/bign192.c": {"id": "/home/mikhail/bee2/src/crypto/bign/bign192.c", "filePath": "/home/mikhail/bee2/src/crypto/bign/bign192.c", "content": "/*\n*******************************************************************************\n\\file bign192.c\n\\brief STB 34.101.45 (bign): Bign algorithms with bign-curve256v1 and bash384\n\\project bee2 [cryptographic library]\n\\created 2026.03.06\n\\version 2026.03.08\n\\copyright The Bee2 authors\n\\license Licensed under the Apache License, Version 2.0 (see LICENSE.txt).\n*******************************************************************************\n*/\n\n#include &quot;bee2/core/err.h&quot;\n#include &quot;bee2/core/mt.h&quot;\n#include &quot;bee2/core/util.h&quot;\n#include &quot;bee2/crypto/bign192.h&quot;\n#include &quot;bee2/math/ww.h&quot;\n#include &quot;bign_lcl.h&quot;\n\n/*\n*******************************************************************************\n\u041f\u0440\u0435\u0434\u0432\u044b\u0447\u0438\u0441\u043b\u0435\u043d\u043d\u044b\u0435 \u0442\u043e\u0447\u043a\u0438\n*******************************************************************************\n*/\n\n#include &quot;pre/bign192_pre_si8.c&quot;\n\n/*\n*******************************************************************************\n\u041a\u0440\u0438\u0432\u0430\u044f\n*******************************************************************************\n*/\n\nstatic size_t _once;\t\t\t/*&lt; \u0442\u0440\u0438\u0433\u0433\u0435\u0440 \u043e\u0434\u043d\u043e\u043a\u0440\u0430\u0442\u043d\u043e\u0441\u0442\u0438 */\nstatic mt_mtx_t _mtx[1];\t\t/*&lt; \u043c\u044c\u044e\u0442\u0435\u043a\u0441 */\nstatic bool_t _inited;\t\t\t/*&lt; \u043c\u044c\u044e\u0442\u0435\u043a\u0441 \u0441\u043e\u0437\u0434\u0430\u043d? */\nstatic ec_o* _ec;\t\t\t\t/*&lt; \u043a\u0440\u0438\u0432\u0430\u044f */\n\nstatic void bign192Destroy()\n{\n\tmtMtxLock(_mtx);\n\tbignEcClose(_ec), _ec = 0;\n\tmtMtxUnlock(_mtx);\n\tmtMtxClose(_mtx);\n}\n\nstatic void bign192Init()\n{\n\tASSERT(!_inited);\n\t// \u0441\u043e\u0437\u0434\u0430\u0442\u044c \u043c\u044c\u044e\u0442\u0435\u043a\u0441\n\tif (!mtMtxCreate(_mtx))\n\t\treturn;\n\t// \u0437\u0430\u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0438\u0440\u043e\u0432\u0430\u0442\u044c \u0434\u0435\u0441\u0442\u0440\u0443\u043a\u0442\u043e\u0440\n\tif (!utilOnExit(bign192Destroy))\n\t{\n\t\tmtMtxClose(_mtx);\n\t\treturn;\n\t}\n\t_inited = TRUE;\n}\n\nstatic err_t bign192Ec(const ec_o** pec)\n{\n\tASSERT(memIsValid(pec, sizeof(const ec_o*)));\n\t// \u0438\u043d\u0438\u0446\u0438\u0430\u043b\u0438\u0437\u0438\u0440\u043e\u0432\u0430\u0442\u044c \u043e\u0434\u043d\u043e\u043a\u0440\u0430\u0442\u043d\u043e\n\tif (!mtCallOnce(&amp;_once, bign192Init) || !_inited)\n\t\treturn ERR_FILE_CREATE;\n\t// \u0437\u0430\u0431\u043b\u043e\u043a\u0438\u0440\u043e\u0432\u0430\u0442\u044c \u043c\u044c\u044e\u0442\u0435\u043a\u0441\n\tmtMtxLock(_mtx);\n\t// \u043a\u0440\u0438\u0432\u0430\u044f \u043d\u0435 \u0441\u043e\u0437\u0434\u0430\u043d\u0430?\n\tif (_ec == 0)\n\t{\n\t\terr_t code;\n\t\tbign_params params[1];\n\t\t// \u0437\u0430\u0433\u0440\u0443\u0437\u0438\u0442\u044c \u043f\u0430\u0440\u0430\u043c\u0435\u0442\u0440\u044b\n\t\tcode = bignParamsStd(params, &quot;1.2.112.0.2.0.34.101.45.3.2&quot;);\n\t\tERR_CALL_HANDLE(code, mtMtxUnlock(_mtx));\n\t\t// \u0441\u043e\u0437\u0434\u0430\u0442\u044c \u043a\u0440\u0438\u0432\u0443\u044e\n\t\tcode = bignEcCreate(&amp;_ec, params);\n\t\tERR_CALL_HANDLE(code, mtMtxUnlock(_mtx));\n\t\t// \u043d\u0430\u0441\u0442\u0440\u043e\u0438\u0442\u044c ec-&gt;pre\n\t\t_ec-&gt;pre = &amp;_pre;\n\t}\n\t// \u0432\u043e\u0437\u0432\u0440\u0430\u0442\u0438\u0442\u044c \u043a\u0440\u0438\u0432\u0443\u044e\n\t*pec = _ec;\n\tmtMtxUnlock(_mtx);\n\treturn ERR_OK;\n}\n\n/*\n*******************************************************************************\n\u04
